  <!-- Smooth outer ring (no spiky edge) -->
  <circle cx="100" cy="100" r="96" fill="#0f766e"/>
  <circle cx="100" cy="100" r="92" fill="#f0fdfa"/>
  <circle cx="100" cy="100" r="88" fill="none" stroke="#0f766e" stroke-width="1.5"/>
  <circle cx="100" cy="100" r="58" fill="none" stroke="#0f766e" stroke-width="1.5"/>
