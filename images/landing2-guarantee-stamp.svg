  <text fill="#0f766e" font-family="Montserrat, Helvetica, Arial, sans-serif" font-size="13.5" font-weight="700" letter-spacing="2.5">
    <textPath href="#stamp-ring">100% GUARANTEED &#183; MONEY BACK &#183; MED-RAMP &#183;</textPath>
