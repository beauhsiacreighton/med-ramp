  <text x="100" y="96" text-anchor="middle" fill="#0f766e" font-family="Montserrat, Helvetica, Arial, sans-serif" font-size="34" font-weight="800">100%</text>
  <text x="100" y="116" text-anchor="middle" fill="#0f766e" font-family="Montserrat, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">GUARANTEED</text>
  <path d="M88,130 l8,8 l16,-16" fill="none" stroke="#0f766e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
