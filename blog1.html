<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog - Med-RAMP</title>
    <link rel="stylesheet" href="css/styles-1.css">
    <style>
        .blog-section {
            padding: 4rem 0 6rem;
        }

        .blog-controls {
            max-width: 1200px;
            margin: 0 auto 3rem;
            padding: 0 2rem;
        }

        .search-bar {
            position: relative;
            margin-bottom: 1.5rem;
        }

        .search-bar input {
            width: 100%;
            padding: 14px 48px 14px 20px;
            font-size: 1rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--bg-white);
            color: var(--text);
            font-family: 'Inter', sans-serif;
        }

        .search-bar input::placeholder {
            color: var(--muted);
        }

        .search-bar input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-light);
        }

        .search-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--muted);
            font-size: 1.1rem;
        }

        .clear-search {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            background: var(--border);
            border: none;
            color: var(--muted);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        .clear-search.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .clear-search:hover {
            background: var(--accent-light);
            color: var(--accent);
        }

        .category-filters {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .filter-btn {
            padding: 10px 20px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--bg-white);
            color: var(--muted);
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .filter-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .filter-btn.active {
            background: var(--accent-light);
            border-color: var(--accent);
            color: var(--accent);
        }

        .results-info {
            text-align: center;
            color: var(--muted);
            margin-top: 1.5rem;
            margin-bottom: 1.5rem;
            font-size: 0.95rem;
        }

        .blog-container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 24px;
        }

        .blog-post {
            background: var(--bg-white);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 28px;
            transition: box-shadow 0.3s ease, border-color 0.3s ease;
            display: flex;
            flex-direction: column;
            text-decoration: none;
            color: inherit;
        }

        .blog-post:hover {
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.06);
            border-color: var(--accent-light);
        }

        .post-content-wrapper {
            display: flex;
            flex-direction: column;
            height: 100%;
            justify-content: space-between;
        }

        .post-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1rem;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .post-category {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            background: var(--accent-light);
            color: var(--accent);
        }

        .post-date {
            color: var(--muted);
            font-size: 0.9rem;
        }

        .post-title {
            font-size: 1.25rem;
            margin-bottom: 12px;
            line-height: 1.35;
            font-weight: 600;
        }

        .post-excerpt {
            color: var(--muted);
            font-size: 0.95rem;
            line-height: 1.7;
            margin-bottom: 1rem;
        }

        .post-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 1rem;
        }

        .post-tag {
            padding: 4px 10px;
            background: var(--bg-warm);
            border-radius: 6px;
            font-size: 0.8rem;
            color: var(--muted);
            transition: background 0.2s ease;
        }

        .post-tag:hover {
            background: var(--accent-light);
            color: var(--accent);
        }

        .post-footer {
            margin-top: auto;
            padding-top: 1rem;
            border-top: 1px solid var(--border);
        }

        .post-author {
            font-weight: 600;
            font-size: 0.9rem;
        }

        .post-read-time {
            color: var(--muted);
            font-size: 0.85rem;
            display: block;
            margin-top: 2px;
        }

        .no-posts {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--muted);
            grid-column: 1 / -1;
        }

        .no-posts h3 {
            color: var(--text) !important;
            margin-bottom: 1rem;
        }

        .no-posts p {
            color: var(--muted);
        }

        .blog-intro {
            text-align: center;
            max-width: 700px;
            margin: 0 auto 2rem;
        }

        .blog-intro h1 {
            font-size: clamp(2.2rem, 4vw, 3.2rem);
            margin-bottom: 12px;
        }

        .blog-intro .subtitle {
            font-size: 1.1rem;
            color: var(--muted);
            margin-bottom: 1rem;
        }

        .blog-intro p {
            color: var(--muted);
            font-size: 1rem;
        }

        .featured-badge {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: var(--accent);
            color: white;
            padding: 4px 12px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 700;
        }

        .pagination-container {
            margin-top: 2rem;
            padding: 1.5rem;
            background: var(--bg-warm);
            border: 1px solid var(--border-warm);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            align-items: center;
            grid-column: 1 / -1;
        }

        .pagination-info {
            color: var(--muted);
            font-size: 0.9rem;
        }

        .pagination-controls {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .pagination-btn {
            padding: 10px 18px;
            background: var(--bg-white);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .pagination-btn:hover:not(.disabled) {
            background: var(--accent-light);
            border-color: var(--accent);
            color: var(--accent);
        }

        .pagination-btn.active {
            background: var(--accent);
            border-color: var(--accent);
            color: white;
        }

        .pagination-btn.disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .pagination-ellipsis {
            color: var(--muted);
            padding: 0 0.5rem;
        }

        @media (max-width: 768px) {
            .blog-container {
                grid-template-columns: 1fr;
            }

            .blog-post {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div id="header-placeholder"></div>

    <main>
        <section class="page-hero">
            <div class="container">
                <div class="blog-intro" data-animate>
                    <h1>Med-RAMP Blog</h1>
                    <p class="subtitle">Insights, tips, and success stories from the Med-RAMP community</p>
                    <p>Stay updated with the latest news, research insights, application tips, and success stories.</p>
                </div>
            </div>
        </section>

        <section class="blog-section">
            <div class="container">
                <div class="blog-controls" data-animate>
                    <div class="search-bar">
                        <span class="search-icon">🔍</span>
                        <input type="text" id="blogSearch" placeholder="Search blog posts by keyword, title, or author..." autocomplete="off">
                        <button class="clear-search" id="clearSearch">Clear</button>
                    </div>
                    <div class="category-filters" id="categoryFilters">
                        <button class="filter-btn active" data-category="all">All Posts</button>
                        <button class="filter-btn" data-category="MCAT Advice">MCAT Advice</button>
                        <button class="filter-btn" data-category="Research Tips">Research Tips</button>
                        <button class="filter-btn" data-category="Application Tips">Application Tips</button>
                        <button class="filter-btn" data-category="Time Management">Time Management</button>
                    </div>
                    <div class="results-info" id="resultsInfo"></div>
                </div>

                <div class="blog-container" id="blogContainer">
                    <div class="no-posts">
                        <div style="font-size: 3rem; margin-bottom: 1rem;">📚</div>
                        <p>Loading blog posts...</p>
                    </div>
                </div>
            </div>
        </section>

        <section class="cta-banner">
            <div class="container">
                <h2 class="cta-title" data-animate>Ready to Join Our Community?</h2>
                <p class="cta-subtext" data-animate>Start your research journey with Med-RAMP today</p>
                <a class="btn btn-dark" href="https://forms.gle/1b31NgtUQn37vqH27" target="_blank" rel="noopener noreferrer">Apply Now</a>
            </div>
        </section>
    </main>

    <div id="footer-placeholder"></div>

    <script src="js/load-header-footer-1.js"></script>
    <script src="js/blog-listing.js" defer></script>
    <script>
        const observer = new IntersectionObserver((entries) => {
            entries.forEach((entry) => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('is-visible');
                    observer.unobserve(entry.target);
                }
            });
        }, { threshold: 0.15 });
        document.querySelectorAll('[data-animate]').forEach((el) => observer.observe(el));
    </script>
</body>
</html>
